// core/agent/Cargo.toml
[package]
name = "runter-agent"
version = "0.3.0"
edition = "2021"

[dependencies]
runter-crypto = { path = "../crypto" }
runter-protocol = { path = "../protocol" }
runter-database = { path = "../database" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dashmap = "6"
ed25519-dalek = "2"
x25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"