// core/database/Cargo.toml
[package]
name = "runter-database"
version = "0.5.0"
edition = "2021"

[dependencies]
runter-crypto = { path = "../crypto" }
runter-protocol = { path = "../protocol" }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex = "0.4"
crc32fast = "1"
prometheus = "0.13"
lazy_static = "1"
crossbeam-queue = "0.3"
parking_lot = "0.12"