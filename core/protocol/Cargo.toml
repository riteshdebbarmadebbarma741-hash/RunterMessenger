// core/protocol/Cargo.toml
[package]
name = "runter-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
runter-crypto = { path = "../crypto" }
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"
hex = "0.4"
ed25519-dalek = "2"