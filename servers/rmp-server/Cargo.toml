// servers/rmp-server/Cargo.toml
[package]
name = "rmp-server"
version = "0.2.0"
edition = "2021"

[dependencies]
runter-crypto = { path = "../../core/crypto" }
runter-protocol = { path = "../../core/protocol" }
runter-database = { path = "../../core/database" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
hex = "0.4"
prometheus = "0.13"
lazy_static = "1"
parking_lot = "0.12"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }